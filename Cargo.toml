[package]
name = "thallium-flash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
fatfs = "0.3.6"
fscommon = "0.1.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
indicatif = "0.18.6"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = { version = "0.6.0", features = ["getrandom"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[[bin]]
name = "thallium-flash"
path = "src/main.rs"
